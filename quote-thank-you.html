<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #006D77; --teal-dark: #00454C; --amber: #FFBF00;
    --cream: #FBF8F1; --white: #FFFFFF; --ink: #10292D;
    --ink-muted: #4B5F63; --ink-faint: #BBBBBB; --border: #D5DFE0;
    --radius: 12px; --radius-lg: 20px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }

  /* NAV */
  nav { position: sticky; top: 0; z-index: 100; background: rgba(251,248,241,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { display: flex; align-items: center; text-decoration: none; }
  .nav-back { font-size: 14px; color: var(--ink-muted); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
  .nav-back:hover { color: var(--teal); }

  /* CONFETTI */
  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }

  /* MAIN */
  .main { max-width: 540px; margin: 0 auto; padding: 0 40px 80px; min-height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* CHECK ANIMATION */
  .check-wrap {
    display: inline-block;
    position: relative;
    margin-bottom: 32px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
  }
  .check-circle {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--white);
    border: 3px solid var(--teal);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 40px rgba(0,109,119,0.12);
  }
  .check-circle svg {
    width: 40px; height: 40px;
    stroke: var(--teal); stroke-width: 3;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .check-circle svg path {
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
    animation: drawCheck 0.4s ease-out 0.65s forwards;
  }
  .check-ring {
    position: absolute; inset: -12px;
    border-radius: 50%;
    border: 2px solid rgba(0,109,119,0.15);
    animation: ringPulse 1.2s ease-out 0.7s both;
  }
  .check-ring-2 {
    position: absolute; inset: -12px;
    border-radius: 50%;
    border: 2px solid rgba(0,109,119,0.1);
    animation: ringPulse 1.2s ease-out 0.9s both;
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes ringPulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* HEADING */
  .main h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(38px, 5vw, 52px);
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    color: var(--ink);
    animation: fadeUp 0.5s ease 0.5s both;
  }
  .main h1 em { font-style: italic; color: var(--teal); }

  .main > .subtitle {
    font-size: 18px; color: var(--ink-muted);
    font-weight: 300; line-height: 1.65;
    max-width: 430px; margin: 0 auto 48px;
    animation: fadeUp 0.5s ease 0.65s both;
  }


  /* PHONE CTA */
  .phone-cta {
    background: var(--white);
    border: 1.5px solid var(--amber);
    border-radius: var(--radius);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 4px 20px rgba(255,191,0,0.1);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.5s ease 0.95s both;
  }
  .phone-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,191,0,0.2); }
  .phone-cta .phone-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,191,0,0.12);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .phone-cta .phone-text { font-size: 15px; color: var(--ink-muted); font-weight: 400; }
  .phone-cta .phone-text strong { color: var(--ink); font-weight: 600; }
  .phone-cta .phone-number {
    font-family: 'Instrument Serif', serif;
    font-size: 22px; color: var(--teal); text-decoration: none;
    letter-spacing: -0.02em; white-space: nowrap;
    transition: color 0.15s;
  }
  .phone-cta .phone-number:hover { color: var(--teal-dark); }

  @media (max-width: 600px) {
    nav { padding: 0 20px; }
    .main { padding: 48px 20px 60px; }
    .phone-cta { flex-direction: column; text-align: center; gap: 8px; padding: 18px 20px; }
  }
  /* header logo: mark + name + descriptor */
  .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { display: block; height: 46px; width: 46px; }
  .brand-text { display: flex; flex-direction: column; gap: 3px; }
  .brand-name { font-family: 'Instrument Serif', Georgia, serif; font-size: 29px; line-height: .9; letter-spacing: -0.01em; color: #006D77; }
  .brand-desc { font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500; line-height: 1; letter-spacing: .01em; color: #00454C; white-space: nowrap; }

<script>
  // Adjust messaging if they skipped step 2
  var skipped = sessionStorage.getItem('step2Completed') === 'false';
  if (skipped) {
    document.getElementById('main-heading').innerHTML = "You're <em>all set!</em>";
    document.getElementById('main-subtitle').textContent = "We'll be in touch shortly to learn more about your space and get your proposals put together.";
  }

  // Confetti
  (function() {
    var canvas = document.getElementById('confetti-canvas');
    var ctx = canvas.getContext('2d');
    var W, H, particles = [], startTime;
    var colors = ['#006D77', '#FFBF00', '#0B7F89', '#FFD54F', '#00454C', '#FFF3C4'];

    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    function Particle() {
      this.x = Math.random() * W;
      this.y = Math.random() * -H * 0.5 - 20;
      this.w = Math.random() * 8 + 4;
      this.h = Math.random() * 4 + 2;
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.vy = Math.random() * 2.5 + 1.5;
      this.vx = Math.random() * 2 - 1;
      this.rotation = Math.random() * 360;
      this.rotSpeed = Math.random() * 6 - 3;
      this.opacity = 1;
    }

    function init() {
      particles = [];
      for (var i = 0; i < 120; i++) particles.push(new Particle());
      startTime = Date.now();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      var elapsed = Date.now() - startTime;
      if (elapsed > 2500) {
        for (var i = 0; i < particles.length; i++) particles[i].opacity -= 0.015;
      }
      var allGone = true;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.opacity <= 0) continue;
        allGone = false;
        p.y += p.vy; p.x += p.vx; p.rotation += p.rotSpeed;
        p.vx += Math.random() * 0.2 - 0.1;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (!allGone) { requestAnimationFrame(draw); }
      else { ctx.clearRect(0, 0, W, H); canvas.style.display = 'none'; }
    }

    setTimeout(init, 400);
  })();
</script>

<script>
  // PostHog: fires when user lands here = full quote conversion complete
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof posthog === 'undefined') return;
    var stored = {}; try { stored = JSON.parse(sessionStorage.getItem('sunriseUtm') || '{}') || {}; } catch (e) {}
    var params = { get: function (k) { return stored[k] || new URLSearchParams(window.location.search).get(k); } };
    var skipped = sessionStorage.getItem('step2Completed') === 'false';
    posthog.capture('quote_confirmed', {
      step: 2,
      step2_skipped: skipped,
      page: window.location.pathname,
      utm_source:   params.get('utm_source')   || null,
      utm_medium:   params.get('utm_medium')   || null,
      utm_campaign: params.get('utm_campaign') || null,
      utm_content:  params.get('utm_content')  || null,
      referrer:     document.referrer           || null
    });
  });
</script>
